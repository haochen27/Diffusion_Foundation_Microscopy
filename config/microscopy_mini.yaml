# Microscopy Diffusion Training Configuration (UNet + EDM)

data:
  foundation_path: "../processed"
  degraded_path: "../processed/degraded"

model:
  architecture: "Unet"              # Select the UNet backbone
  input_size: [256, 256]
  # UNet-specific parameters (defaults match basic UNet)
  unet_base_channels: 64            # maps to dim
  unet_channel_mult: [1, 2, 4, 8]
  unet_time_dim: 64
  # Latent params kept for compatibility (unused when vae.enabled=false)
  latent_size: 64
  latent_channels: 4
  condition_size: [256, 256]
  target_size: [256, 256]

vae:
  enabled: false
  model_id: "stabilityai/sd-vae-ft-ema"

train:
  accumulate_grad_batches: 1
  dataloader_workers: 4
  save_interval: 1000
  gradient_checkpointing: false
  save_path: "microscopy_runs_unet"

optimizer:
  lr: 0.0005
  weight_decay: 0.0
  min_lr: 0.00001

# EDM scheduler
scheduler:
  type: "EDMEulerScheduler"
  num_train_timesteps: 100
  sigma_min: 0.002
  sigma_max: 10.0
  sigma_data: 0.5
  rho: 7.0
  prediction_type: "sample"

ema:
  enabled: false

monitoring:
  log_every_n_steps: 4
  val_check_interval: 4
  progress_bar: false
  save_top_k: 2
  monitor_metric: "val_loss"
  image_log_every_n_steps: 0
  image_log_max_images: 8
  plot_loss: false
  plot_lr: false
  plot_samples: true
  sample_every_n_epochs: 50
  num_samples: 4
  edm_steps: 100
  sample_start_epoch: 1

# wandb:
#   project: "MicroscopyDiffusion-UNet"

phases:
  - name: "unet_phase1"
    type: "unconditional"
    epochs: 1000
    batch_size: 8
    max_steps: -1
    datasets: ["mini"]
    epochs_to_save: [250, 500, 750, 1000]
    resume_from_checkpoint: "./microscopy_runs_unet/checkpoints/last.ckpt"
    description: "UNet (EDM) unconditional prior on microscopy mini dataset"

