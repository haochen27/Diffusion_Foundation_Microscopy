# Microscopy Diffusion Training Configuration
# DiT-XL/8 based 512x512 generation

# Data configuration
data:
  foundation_path: "../processed/foundation"
  degraded_path: "../processed/degraded"

# Model configuration
model:
  architecture: "DiT-S/8"        # DiT-L with patch size 8 for 512x512
  input_size: [512, 512]          # Direct pixel-level input size
  patch_size: 8                   # Patch size for DiT (512//8 = 64 patches per dim)
  hidden_size: 384               # DiT-XL hidden dimension
  # Settings used when training in VAE latent space
  latent_size: 64                 # Spatial size of VAE latents (e.g., 64x64)
  latent_channels: 4              # Channel count of VAE latents (SD VAE uses 4)
  condition_size: [512, 512]
  target_size: [512, 512]

# VAE configuration
vae:
  enabled: false                      # Set to true to train in latent space
  model_id: "stabilityai/sd-vae-ft-ema"  # VAE model (only used if enabled: true)

# Training configuration
train:
  accumulate_grad_batches: 1            # increase for gradient accumulation if memory-bound
  dataloader_workers: 16                 # tune per machine; A100/H100 can handle higher
  #devices: 2                           # force specific number of GPUs (auto-detect if not set)
  save_interval: 1000
  gradient_checkpointing: false   # DiT doesn't need this
  save_path: "microscopy_runs_rxrx1"

  # Logging (optional)
  wandb:
    project: "MicroscopyDiffusion"

# Optimizer configuration
optimizer:
  lr: 0.0001
  weight_decay: 0.01
  min_lr: 0.000001

# Scheduler configuration
scheduler:
  type: "EDMEulerScheduler"           # EDM scheduler for better sampling
  num_train_timesteps: 1000
  sigma_min: 0.002
  sigma_max: 80.0
  sigma_data: 0.4
  rho: 7.0
  prediction_type: "sample" 

# EMA (Exponential Moving Average) configuration
ema:
  enabled: true
  decay: 0.9995
  update_every: 1
  start_step: 2000

# Real-time monitoring
monitoring:
  log_every_n_steps: 95
  val_check_interval: 95
  progress_bar: true
  save_top_k: 2
  monitor_metric: "val_loss"
  # Image logging
  image_log_every_n_steps: 2000
  image_log_max_images: 8
  
  # Real-time plots
  plot_loss: true
  plot_lr: true
  plot_samples: true
  sample_every_n_epochs: 5
  
  # EDM sampling configuration for callbacks
  num_samples: 4                    # Number of samples to generate
  edm_steps: 100                   # EDM sampling steps (high quality)
  sample_start_epoch: 1           # Start sampling after epoch 10

## Phase definitions (production scale)
phases:
  # Phase 1: Unconditional prior on ~100k images
  - name: "rxrx1"
    type: "unconditional"
    epochs: 200                       # or tune based on dataset size
    batch_size: 64                     # adjust per GPU memory
    max_steps: -1                     # ~100k images at batch_size=16
    resume_from_checkpoint: "./microscopy_runs/checkpoints/phase1_unconditional_epoch_050.ckpt"  # manual resume
    #min_steps: 1000                     # minimum steps before early sto2
    datasets: ["rxrx1"]
    epochs_to_save: [50, 100, 150, 200]
    description: "Unconditional DiT-S/8 prior on microscopy foundation (~100k images)"
